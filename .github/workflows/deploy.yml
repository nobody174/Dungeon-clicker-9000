name: CI/CD — Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Run tests ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Job 2: Deploy (only runs if tests pass) ──────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Cache-busting: stamps every JS import + the entry <script> tag with ?v=<version> so a
      # release always forces browsers to re-fetch every module, not just index.html/main.js.
      # Runs against a copy in pages-build/ — never touches the checked-out source, so local dev
      # (npm run serve) keeps clean, unversioned import paths. See scripts/stamp-versions.js.
      - name: Prepare version-stamped build
        run: |
          mkdir -p pages-build
          cp index.html pages-build/
          cp -r js pages-build/
          node scripts/stamp-versions.js pages-build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pages-build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 3: Deploy to itch.io ─────────────────────────────────
  deploy-itch:
    name: 🎮 Deploy to itch.io
    needs: test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare itch.io build folder
        run: |
          mkdir -p itch-build
          cp index.html itch-build/
          cp -r js itch-build/

      # Cache-busting: same ?v=<version> stamp as the GitHub Pages build (see scripts/stamp-versions.js)
      # so a stale-JS report on itch.io (this exact class of bug happened twice already) can't
      # recur — only touches the itch-build/ copy, never the checked-out source.
      - name: Stamp cache-busting versions
        run: node scripts/stamp-versions.js itch-build

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push itch-build ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:html
